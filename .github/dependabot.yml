version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Versão principal nova exige migração, então é decidida à parte
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      atualizacoes-menores:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
